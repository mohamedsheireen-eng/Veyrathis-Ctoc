<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Orbit</title>
    <style>
        body {
            margin: 0;
            background: #080810;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #gameContainer {
            position: relative;
            box-shadow: 0 0 30px rgba(0, 180, 255, 0.2);
            border-radius: 10px;
            overflow: hidden;
        }
        canvas {
            display: block;
            background: radial-gradient(circle, #101428 0%, #050510 100%);
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
        }
        .stat {
            font-size: 18px;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(255,255,255,0.5);
        }
        #shots { color: #ff5577; }
        #score { color: #00ffcc; }
    </style>
</head>
<body>

<div id="gameContainer">
    <div id="ui">
        <div class="stat" id="shots">Shots: 5</div>
        <div class="stat" id="score">Score: 0</div>
    </div>
    <canvas id="gameCanvas" width="600" height="600"></canvas>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const shotsEl = document.getElementById('shots');

let score = 0;
let shots = 5;
const centerX = canvas.width / 2;
const centerY = canvas.height / 2;

let projectiles = [];
let particles = [];
let rings = [];

// Synthesizer for retro retro/sci-fi sound effects without audio files
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(freq, type, duration) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

// Generate target rings
function initGame() {
    rings = [];
    const ringCount = 4;
    for (let i = 0; i < ringCount; i++) {
        let radius = 80 + i * 55;
        let speed = (0.01 + (i * 0.005)) * (Math.random() > 0.5 ? 1 : -1);
        let targets = [];
        let targetCount = 8 + (i * 4);
        
        for (let j = 0; j < targetCount; j++) {
            targets.push({
                angle: (j / targetCount) * Math.PI * 2,
                active: true,
                color: `hsl(${i * 60 + 180}, 90%, 60%)`
            });
        }
        rings.push({ radius, speed, targets });
    }
}

// Click to shoot
canvas.addEventListener('click', (e) => {
    if (shots <= 0 && projectiles.length === 0) return;
    if (shots > 0) {
        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        
        // Calculate angle from center to mouse click
        const angle = Math.atan2(mouseY - centerY, mouseX - centerX);
        
        projectiles.push({
            x: centerX,
            y: centerY,
            vx: Math.cos(angle) * 5,
            vy: Math.sin(angle) * 5,
            radius: 6,
            isEcho: false
        });
        
        shots--;
        shotsEl.innerText = `Shots: ${shots}`;
        playSound(300, 'sine', 0.2);
    }
});

function createExplosion(x, y, color) {
    playSound(150, 'triangle', 0.4);
    for (let i = 0; i < 12; i++) {
        particles.push({
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 4,
            vy: (Math.random() - 0.5) * 4,
            radius: Math.random() * 3 + 1,
            color: color,
            alpha: 1
        });
    }
}

function spawnEchoes(x, y, baseColor) {
    for (let i = 0; i < 3; i++) {
        let angle = Math.random() * Math.PI * 2;
        projectiles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * 3.5,
            vy: Math.sin(angle) * 3.5,
            radius: 4,
            isEcho: true,
            color: baseColor
        });
    }
}

function update() {
    // Rotate rings
    rings.forEach(ring => {
        ring.targets.forEach(t => {
            t.angle += ring.speed;
        });
    });

    // Update projectiles
    for (let pIdx = projectiles.length - 1; pIdx >= 0; pIdx--) {
        let p = projectiles[pIdx];
        p.x += p.vx;
        p.y += p.vy;

        // Apply a slight gravity pull towards the center core to warp trajectories
        let dx = centerX - p.x;
        let dy = centerY - p.y;
        let distToCenter = Math.sqrt(dx*dx + dy*dy);
        if (distToCenter > 40) {
            p.vx += (dx / distToCenter) * 0.04;
            p.vy += (dy / distToCenter) * 0.04;
        }

        // Check collisions with targets
        let hit = false;
        rings.forEach(ring => {
            ring.targets.forEach(t => {
                if (!t.active) return;
                
                let tx = centerX + Math.cos(t.angle) * ring.radius;
                let ty = centerY + Math.sin(t.angle) * ring.radius;
                
                let tDx = p.x - tx;
                let tDy = p.y - ty;
                let tDist = Math.sqrt(tDx*tDx + tDy*tDy);

                if (tDist < p.radius + 10) {
                    t.active = false;
                    hit = true;
                    score += p.isEcho ? 20 : 10;
                    scoreEl.innerText = `Score: ${score}`;
                    createExplosion(tx, ty, t.color);
                    spawnEchoes(tx, ty, t.color);
                }
            });
        });

        // Remove if hit or out of bounds
        if (hit || p.x < 0 || p.x > canvas.width || p.y < 0 || p.y > canvas.height) {
            projectiles.splice(pIdx, 1);
        }
    }

    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
        let pt = particles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.alpha -= 0.02;
        if (pt.alpha <= 0) particles.splice(i, 1);
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw Core
    ctx.beginPath();
    ctx.arc(centerX, centerY, 20, 0, Math.PI * 2);
    ctx.fillStyle = '#1a2244';
    ctx.strokeStyle = '#3b4f8c';
    ctx.lineWidth = 3;
    ctx.fill();
    ctx.stroke();

    // Draw Rings & Targets
    rings.forEach(ring => {
        ctx.beginPath();
        ctx.arc(centerX, centerY, ring.radius, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255,255,255,0.04)';
        ctx.lineWidth = 1;
        ctx.stroke();

        ring.targets.forEach(t => {
            if (!t.active) return;
            let tx = centerX + Math.cos(t.angle) * ring.radius;
            let ty = centerY + Math.sin(t.angle) * ring.radius;

            ctx.beginPath();
            ctx.arc(tx, ty, 8, 0, Math.PI * 2);
            ctx.fillStyle = t.color;
            ctx.shadowBlur = 10;
            ctx.shadowColor = t.color;
            ctx.fill();
            ctx.shadowBlur = 0; // reset
        });
    });

    // Draw Projectiles
    projectiles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.isEcho ? p.color : '#ffffff';
        ctx.shadowBlur = 8;
        ctx.shadowColor = ctx.fillStyle;
        ctx.fill();
        ctx.shadowBlur = 0;
    });

    // Draw Particles
    particles.forEach(pt => {
        ctx.save();
        ctx.globalAlpha = pt.alpha;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.radius, 0, Math.PI * 2);
        ctx.fillStyle = pt.color;
        ctx.fill();
        ctx.restore();
    });
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

initGame();
loop();
</script>
</body>
</html>
